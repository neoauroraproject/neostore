services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neostore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neostore}
      POSTGRES_DB: ${POSTGRES_DB:-neostore}
    volumes:
      - neostore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - neostore

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - neostore

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neostore}:${POSTGRES_PASSWORD:-neostore}@postgres:5432/${POSTGRES_DB:-neostore}
      REDIS_URL: redis://redis:6379
      PORT: "4100"
    volumes:
      - neostore_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neostore
    expose:
      - "4100"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./install/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - neostore

volumes:
  neostore_pg:
  neostore_storage:
  caddy_data:
  caddy_config:

networks:
  neostore:
    driver: bridge
